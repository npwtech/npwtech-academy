# Configuração do projeto Supabase da loja do ebook.
# As seções [auth] valem para o ambiente local e podem ser enviadas ao projeto com `supabase config push`.
# As demais opções seguem o padrão do Supabase.

[auth]
site_url = "https://academy.npwtech.com.br"
additional_redirect_urls = ["https://academy.npwtech.com.br"]
# Sessões curtas, renovadas automaticamente pelo site.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Login só por código no e-mail: sem cadastro anônimo nem por telefone.
enable_anonymous_sign_ins = false

[auth.rate_limit]
# Envio de e-mails (códigos) por hora para o projeto inteiro.
email_sent = 30
# Tentativas de login/cadastro e de verificação de código, por 5 minutos e por IP.
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
# Código de 6 dígitos válido por 10 minutos; novo envio só depois de 60 segundos.
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

[auth.sms]
enable_signup = false

# CAPTCHA no login (recomendado em produção contra robôs que disparam e-mails):
# crie uma chave no Cloudflare Turnstile e ative em Authentication → Bot and Abuse Protection.
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

# Chamadas pelo site com o token do usuário logado: o gateway exige JWT válido.
[functions.create-checkout]
verify_jwt = true

[functions.sync-order]
verify_jwt = true

# Chamada pelos servidores do Mercado Pago, que não enviam JWT.
# A autenticidade é garantida pela assinatura x-signature (MP_WEBHOOK_SECRET)
# e pela consulta do pagamento direto na API do Mercado Pago.
[functions.mp-webhook]
verify_jwt = false
